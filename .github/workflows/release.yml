name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Parse tag
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing v${VERSION}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Install playwright chromium
        run: bunx playwright-core install --with-deps chromium

      - name: Smoke tests (npm-install + workspace dev preview)
        run: bun run smoke

      - name: Set version
        run: |
          node -e "
            const fs = require('fs');
            const version = '${{ steps.tag.outputs.version }}';
            const p = 'packages/core/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(p, JSON.stringify(pkg, null, '\t') + '\n');
          "

      - name: Publish kurikulum
        working-directory: packages/core
        run: npm publish --provenance --access public
